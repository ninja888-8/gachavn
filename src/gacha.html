<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kira Kira Study Club</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="gacha-shell">
    <div class="gacha-backdrop">
        <canvas id="canvas"></canvas>
        <div class="gacha-overlay" id="gacha-overlay">
            <header class="gacha-card">
                <div>
                    <p class="eyebrow">Stargazer</p>
                    <h1>Spend your earned stargazing attempts</h1>
                    <p class="hero-copy">Every correct answer gives you an opportunity to search the stars. Use them here to find more characters!</p>
                </div>
                <div class="stats-card">
                    <span class="stats-label">Available pulls</span>
                    <div class="stats-value" id="pull-count-display">0</div>
                    <!-- <span class="stats-subtitle">ready to spend</span> -->
                </div>
            </header>
            <div id="gamble-controls">
                <button id="gamble1" class="primary-btn">Stargaze x1</button>
                <button id="gamble10" class="secondary-btn">Stargaze x10</button>
            </div>
            <a class="text-link" href="novel.html">Return to quiz</a>
        </div>
        <div id="pull-overlay">
            <div id="character-splash" style="display: none;">
                <img src="" id="image" class="silhouette">
                <div id="char-desc" style="opacity: 0;">
                    <p id="name"></p>
                    <p id="rarity"></p>
                </div>
            </div>
            <div id="pull-list" style="display: none;"></div>
        </div>
    </div>
</body>

<script type="module" src="./ts/gacha.ts"></script>
<script type="module" src="./ts/canvas.ts"></script>

</html>
